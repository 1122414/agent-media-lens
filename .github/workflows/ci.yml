name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --python 3.12
      - run: pnpm build && pnpm lint && pnpm test
      - run: uv run --frozen ruff check workers scripts/douyin-login.py tests && uv run --frozen mypy workers && uv run --frozen pytest -q tests
      - run: node scripts/check-plugin.mjs
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate optional local provider configuration
        run: LENS_PROVIDER_CONTAINER=validation-only docker compose -f compose.yaml -f compose.local-provider.yaml config --quiet
      - run: docker compose config --quiet && docker compose build && docker compose run --rm lens --help
